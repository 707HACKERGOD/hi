<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Layout</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f0f0f0 url('bg.gif') center/cover no-repeat;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }

        .cake-container {
            position: relative;
            width: 30vmin;
            max-width: 400px;
            margin: 20px;
            margin-top: 80px;
        }

        .cake {
            width: 100%;
            height: auto;
            display: block;
        }

        .candle-container {
            position: absolute;
            width: 23%;
            aspect-ratio: 59/81;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .candle-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.1s;
        }

        #candle1 { left: 52%; top: -4.5%; }
        #candle2 { left: 62%; top: -8%; }
        #candle3 { left: 73%; top: -4.5%; }

        .banner {
            width: 60vmin;
            max-width: 480px;
            margin-top: 20px;
        }

        .banner-img {
            width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            .cake-container { width: 70vmin; }
            .banner { width: 85vmin; }
        }

        .candle-container:active .candle-img {
            transform: scale(0.95);
        }

        .floating-element {
            position: fixed;
            pointer-events: auto;
            user-select: none;
            z-index: 1000;
            transition: opacity 0.3s;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
        }

        .bubble {
            animation: float 8s infinite linear;
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
            cursor: pointer;
        }

        .balloon {
            cursor: grab;
            transition: transform 0.2s;
            transform-origin: center bottom;
            touch-action: none;
        }

        .balloon.dragging {
            cursor: grabbing;
            z-index: 1500;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(3deg); }
            50% { transform: translateY(-40px) rotate(-2deg); }
            75% { transform: translateY(-20px) rotate(3deg); }
        }
    </style>
</head>

<body>
    <div class="cake-container">
        <img src="cake.gif" alt="Cake" class="cake" draggable="false">
        <div class="candle-container" id="candle1">
            <img src="lit_candle_1.gif" alt="Candle" class="candle-img" draggable="false">
        </div>
        <div class="candle-container" id="candle2">
            <img src="lit_candle_1.gif" alt="Candle" class="candle-img" draggable="false">
        </div>
        <div class="candle-container" id="candle3">
            <img src="lit_candle_1.gif" alt="Candle" class="candle-img" draggable="false">
        </div>
    </div>

    <div class="banner">
        <img src="banner.png" alt="Celebration Banner" class="banner-img" draggable="false">
    </div>

    <script>
        document.addEventListener('dragstart', e => e.preventDefault());

        document.addEventListener('DOMContentLoaded', () => {
            const preloadImages = ['blowing_candle_1.gif', 'unlit_candle_1.gif'];
            preloadImages.forEach(src => new Image().src = src);

            function blowOutCandle(event) {
                const container = event.currentTarget;
                const candleImg = container.querySelector('.candle-img');
                if (!candleImg || !candleImg.src.includes('lit_candle')) return;

                const startTime = Date.now();
                container.style.pointerEvents = 'none';
                candleImg.src = `blowing_candle_1.gif?t=${Date.now()}`;

                const checkFrame = () => {
                    if (Date.now() - startTime >= 2600) {
                        candleImg.src = 'unlit_candle_1.gif';
                        container.removeEventListener('click', blowOutCandle);
                        container.removeEventListener('touchstart', blowOutCandle);
                    } else {
                        requestAnimationFrame(checkFrame);
                    }
                };
                requestAnimationFrame(checkFrame);
            }

            document.querySelectorAll('.candle-container').forEach(container => {
                container.addEventListener('click', blowOutCandle);
                container.addEventListener('touchstart', blowOutCandle);
                container.style.touchAction = 'manipulation';
            });

            const cakeRect = document.querySelector('.cake-container')?.getBoundingClientRect() || { left: 0, top: 0 };
            const elements = new Map();
            let currentDragged = null;

            const spawnConfig = {
                bubble: {
                    rate: 3000,
                    max: 15,
                    size: { min: 100, max: 250 }
                },
                balloon: {
                    rate: 5000,
                    max: 8,
                    size: { min: 250, max: 400 },
                    speed: { min: 0.1, max: 0.3 }
                }
            };

            function spawnFloatingElement(type) {
                try {
                    if (document.querySelectorAll(`.${type}`).length >= spawnConfig[type].max) return;

                    const element = document.createElement('img');
                    element.className = `floating-element ${type}`;
                    element.draggable = false;
                    element.src = `${type}.png`;

                    const baseSize = Math.random() *
                        (spawnConfig[type].size.max - spawnConfig[type].size.min) +
                        spawnConfig[type].size.min;

                    const [x, y] = (() => {
                        let posX, posY;
                        do {
                            posX = Math.random() * (window.innerWidth - baseSize);
                            posY = Math.random() * (window.innerHeight - baseSize);
                        } while (Math.abs(posX - cakeRect.left) < 200 && Math.abs(posY - cakeRect.top) < 200);
                        return [posX, posY];
                    })();

                    element.style.width = `${baseSize}px`;
                    element.style.left = `${x}px`;
                    element.style.top = `${y}px`;

                    if (type === 'bubble') {
                        element.style.opacity = Math.random() * 0.5 + 0.5;
                        element.addEventListener('click', () => {
                            element.style.opacity = '0';
                            setTimeout(() => element.remove(), 300);
                        });
                    }

                    if (type === 'balloon') {
                        element.style.transform = `rotate(${Math.random() * 15 - 7.5}deg)`;
                        const initialSpeed = spawnConfig.balloon.speed;
                        elements.set(element, {
                            x, y,
                            vx: (Math.random() - 0.5) * initialSpeed.max,
                            vy: -Math.random() * initialSpeed.max,
                            floatSeed: Math.random() * 1000
                        });
                        setupBalloonDrag(element);
                    }

                    document.body.appendChild(element);
                } catch (error) {
                    console.error('Error spawning element:', error);
                }
            }

            const MAX_SPEED = 1200;

            function setupBalloonDrag(balloon) {
                balloon.draggable = false;
                balloon.style.touchAction = 'none';

                let isDragging = false;
                let grab = { x: 0, y: 0 };
                let lastPos = { x: 0, y: 0 };
                let lastClient = { x: 0, y: 0 };
                let lastTime = 0;
                let startTime = 0;
                let totalMoved = 0;
                const vel = { x: 0, y: 0 };

                const pt = (e) => e.touches?.[0] ?? e.changedTouches?.[0] ?? e;

                const startDrag = (e) => {
                    e.preventDefault();
                    const p = pt(e);
                    const data = elements.get(balloon);
                    if (!data) return;

                    isDragging = true;
                    currentDragged = balloon;
                    grab.x = p.clientX - data.x;
                    grab.y = p.clientY - data.y;
                    lastPos = { x: p.clientX, y: p.clientY };
                    lastClient = { x: p.clientX, y: p.clientY };
                    lastTime = performance.now();
                    startTime = lastTime;
                    totalMoved = 0;
                    vel.x = vel.y = 0;
                    balloon.classList.add('dragging');
                };

                const drag = (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const p = pt(e);
                    const data = elements.get(balloon);
                    if (!data) return;

                    const now = performance.now();
                    const dt = Math.max((now - lastTime) / 1000, 1 / 240);

                    const dx = p.clientX - lastPos.x;
                    const dy = p.clientY - lastPos.y;
                    totalMoved += Math.hypot(dx, dy);

                    vel.x = vel.x * 0.7 + (dx / dt) * 0.3;
                    vel.y = vel.y * 0.7 + (dy / dt) * 0.3;

                    data.x = p.clientX - grab.x;
                    data.y = p.clientY - grab.y;
                    balloon.style.left = data.x + 'px';
                    balloon.style.top = data.y + 'px';

                    lastPos = { x: p.clientX, y: p.clientY };
                    lastClient = { x: p.clientX, y: p.clientY };
                    lastTime = now;
                };

                const endDrag = () => {
                    if (!isDragging) return;
                    isDragging = false;
                    currentDragged = null;
                    balloon.classList.remove('dragging');

                    const data = elements.get(balloon);
                    if (!data) return;

                    const held = performance.now() - startTime;

                    if (totalMoved < 10 && held < 400) {
                        const w = balloon.offsetWidth;
                        const h = balloon.offsetHeight;
                        const cx = data.x + w / 2;
                        const cy = data.y + h / 2;

                        let dx = cx - lastClient.x;
                        let dy = cy - lastClient.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist < 1) { dx = 0; dy = -1; dist = 1; }

                        const nx = dx / dist;
                        const ny = dy / dist;
                        const maxDist = Math.max(w, h) * 0.5;
                        const strength = (200 + 300 * Math.min(dist / maxDist, 1)) / 60;

                        data.vx += nx * strength;
                        data.vy += ny * strength;
                    } else {
                        const clamp = (v) => Math.max(-MAX_SPEED, Math.min(MAX_SPEED, v * 0.5));
                        data.vx = clamp(vel.x) / 60;
                        data.vy = clamp(vel.y) / 60;
                    }
                };

                balloon.addEventListener('mousedown', startDrag);
                balloon.addEventListener('touchstart', startDrag, { passive: false });
                balloon.addEventListener('dragstart', (e) => e.preventDefault());
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
            }

            function updateElements() {
                const now = Date.now();
                elements.forEach((data, element) => {
                    if (element === currentDragged) return;

                    if (element.classList.contains('balloon')) {
                        const time = now * 0.001 + data.floatSeed;
                        data.vx += Math.cos(time * 0.8) * 0.015;
                        data.vy += Math.sin(time * 1.2) * 0.02 - 0.01;
                        data.vx *= 0.93;
                        data.vy *= 0.95;
                    }

                    data.x += data.vx;
                    data.y += data.vy;

                    const rect = element.getBoundingClientRect();
                    if (data.x < -rect.width) data.x = window.innerWidth;
                    if (data.x > window.innerWidth) data.x = -rect.width;
                    if (data.y < -rect.height) data.y = window.innerHeight;
                    if (data.y > window.innerHeight) data.y = -rect.height;

                    element.style.left = `${data.x}px`;
                    element.style.top = `${data.y}px`;
                });
                requestAnimationFrame(updateElements);
            }

            setInterval(() => spawnFloatingElement('bubble'), spawnConfig.bubble.rate);
            setInterval(() => spawnFloatingElement('balloon'), spawnConfig.balloon.rate);
            setTimeout(() => spawnFloatingElement('bubble'), 300);
            setTimeout(() => spawnFloatingElement('balloon'), 600);
            setTimeout(() => spawnFloatingElement('bubble'), 1000);
            setTimeout(() => spawnFloatingElement('balloon'), 1500);
            updateElements();
        });
    </script>
</body>
</html>
