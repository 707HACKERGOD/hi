<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Layout</title>
<style>
    html, body { height: 100%; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #f0f0f0 url('bg.gif') center/cover no-repeat;
        overscroll-behavior: none;

        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }

    img {
        -webkit-user-drag: none;
        user-drag: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        pointer-events: none;     
    }

    .cake-container {
        position: relative;
        width: 30vmin;
        max-width: 400px;
        margin: 20px;
        margin-top: 80px;
    }

    .cake { width: 100%; height: auto; display: block; }

    .candle-container {
        position: absolute;
        width: 23%;
        aspect-ratio: 59/81;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: auto;  
        touch-action: manipulation;
    }

    .candle-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.1s; }

    #candle1 { left: 52%; top: -4.5%; }
    #candle2 { left: 62%; top: -8%; }
    #candle3 { left: 73%; top: -4.5%; }

    .candle-container:active .candle-img { transform: scale(0.95); }

    .banner { width: 60vmin; max-width: 480px; margin-top: 20px; pointer-events: none; }
    .banner-img { width: 100%; height: auto; }

    @media (max-width: 600px) {
        .cake-container { width: 70vmin; }
        .banner { width: 85vmin; }
    }

    .floating-element {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: auto;       
        z-index: 1000;
        transition: opacity 0.3s;
        will-change: transform;
        transform: translateZ(0);
        image-rendering: crisp-edges;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
    }

    .bubble {
        animation: float 8s infinite linear;
        filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.1));
        cursor: pointer;
    }

    .balloon {
        cursor: grab;
        touch-action: none;         
        transform-origin: 50% 50%;
    }

    .balloon.dragging {
        cursor: grabbing;
        z-index: 1500;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25%      { transform: translateY(-20px) rotate(3deg); }
        50%      { transform: translateY(-40px) rotate(-2deg); }
        75%      { transform: translateY(-20px) rotate(3deg); }
    }
</style>
</head>

<body>
    <div class="cake-container">
        <img src="cake.gif" alt="Cake" class="cake">
        <div class="candle-container" id="candle1">
            <img src="lit_candle_1.gif" alt="Candle" class="candle-img">
        </div>
        <div class="candle-container" id="candle2">
            <img src="lit_candle_1.gif" alt="Candle" class="candle-img">
        </div>
        <div class="candle-container" id="candle3">
            <img src="lit_candle_1.gif" alt="Candle" class="candle-img">
        </div>
    </div>

    <div class="banner">
        <img src="banner.png" alt="Celebration Banner" class="banner-img">
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    document.addEventListener('dragstart', e => e.preventDefault());
    document.querySelectorAll('img').forEach(img => { img.draggable = false; });

    ['blowing_candle_1.gif', 'unlit_candle_1.gif'].forEach(src => { new Image().src = src; });

    function blowOutCandle(event) {
        const container = event.currentTarget;
        const candleImg = container.querySelector('.candle-img');
        if (!candleImg || !candleImg.src.includes('lit_candle')) return;

        container.style.pointerEvents = 'none';
        candleImg.src = `blowing_candle_1.gif?t=${Date.now()}`;
        setTimeout(() => { candleImg.src = 'unlit_candle_1.gif'; }, 2600);
    }

    document.querySelectorAll('.candle-container').forEach(c => {
        c.addEventListener('click', blowOutCandle);
    });
    const rand  = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    const CFG = {
        bubble:  { rate: 2600, max: 14, size: [50, 110] },
        balloon: { rate: 3800, max: 7,  size: [64, 104] }
    };

    function randomPosition(w, h) {
        const W = window.innerWidth, H = window.innerHeight;
        const cake = document.querySelector('.cake-container');
        const cr = cake ? cake.getBoundingClientRect() : null;
        const maxX = Math.max(0, W - w);
        const maxY = Math.max(0, H - h);

        for (let i = 0; i < 20; i++) {
            const x = rand(0, maxX);
            const y = rand(0, maxY);
            if (!cr) return { x, y };
            const pad = 40;
            const overlaps =
                x + w > cr.left - pad && x < cr.right + pad &&
                y + h > cr.top  - pad && y < cr.bottom + pad;
            if (!overlaps) return { x, y };
        }
        return { x: rand(0, maxX), y: rand(0, maxY) };
    }

    function createBubble() {
        if (document.querySelectorAll('.bubble').length >= CFG.bubble.max) return;

        const el = document.createElement('img');
        el.className = 'floating-element bubble';
        el.alt = '';
        el.draggable = false;

        const size = Math.round(rand(CFG.bubble.size[0], CFG.bubble.size[1]));
        el.style.width = size + 'px';
        el.style.opacity = rand(0.5, 1).toFixed(2);

        const pos = randomPosition(size, size);
        el.style.left = pos.x + 'px';
        el.style.top  = pos.y + 'px';

        el.addEventListener('pointerdown', e => {
            e.preventDefault();
            e.stopPropagation();
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 300);
        });

        el.src = 'bubble.png';
        document.body.appendChild(el);
    }

    const balloons = new Map();   // <img> -> state

    // tuning
    const LIFT        = 90;       // upward acceleration  (px/s²)
    const AIR_DAMP    = 0.28;     // velocity retained per second (exponential)
    const MAX_V       = 900;      // px/s
    const WALL_BOUNCE = 0.55;
    const POKE_MIN    = 260;      // px/s
    const POKE_MAX    = 520;      // px/s

    function render(b) {
        const tilt = clamp(b.vx * 0.035, -16, 16);    
        const sx = 1 + b.sq * 0.6;                    
        const sy = 1 - b.sq * 0.6;
        b.el.style.transform =
            `translate3d(${b.x}px, ${b.y}px, 0) ` +
            `rotate(${tilt.toFixed(2)}deg) ` +
            `scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
    }

    function createBalloon() {
        if (balloons.size >= CFG.balloon.max) return;

        const el = document.createElement('img');
        el.className = 'floating-element balloon';
        el.alt = '';
        el.draggable = false;
        el.style.width = Math.round(rand(CFG.balloon.size[0], CFG.balloon.size[1])) + 'px';
        el.style.visibility = 'hidden';               

        let done = false;
        const finish = () => {
            if (done) return;
            done = true;

            const r = el.getBoundingClientRect();
            const w = r.width  || 70;
            const h = r.height || 100;

            const pos = randomPosition(w, h);
            const state = {
                el, w, h,
                x: pos.x, y: pos.y,
                vx: rand(-25, 25),
                vy: rand(-40, -10),
                phase: rand(0, Math.PI * 2),
                sq: 0, sqv: 0,                        
                dragging: false
            };

            balloons.set(el, state);
            render(state);
            el.style.visibility = '';
            el.addEventListener('pointerdown', onBalloonPointerDown);
        };

        el.addEventListener('load', finish, { once: true });
        el.addEventListener('error', () => el.remove(), { once: true });
        el.src = 'balloon.png';

        document.body.appendChild(el);
        if (el.complete && el.naturalWidth) finish();
    }

    let drag = null;

    function onBalloonPointerDown(e) {
        if (drag) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        const el = e.currentTarget;
        const b = balloons.get(el);
        if (!b) return;

        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (_) {}

        drag = {
            el, b,
            id: e.pointerId,
            offX: e.clientX - b.x,
            offY: e.clientY - b.y,
            lastT: performance.now(),
            vx: 0, vy: 0,
            moved: 0,
            downT: performance.now()
        };

        b.dragging = true;
        b.sqv += 4;
        el.classList.add('dragging');

        el.addEventListener('pointermove', onPointerMove);
        el.addEventListener('pointerup', onPointerUp);
        el.addEventListener('pointercancel', onPointerUp);
    }

    function onPointerMove(e) {
        if (!drag || e.pointerId !== drag.id) return;
        e.preventDefault();

        const b  = drag.b;
        const now = performance.now();
        const dt  = Math.max((now - drag.lastT) / 1000, 1 / 240);

        const nx = e.clientX - drag.offX;
        const ny = e.clientY - drag.offY;

        const dx = nx - b.x;
        const dy = ny - b.y;
        drag.moved += Math.hypot(dx, dy);

        drag.vx = drag.vx * 0.75 + (dx / dt) * 0.25;
        drag.vy = drag.vy * 0.75 + (dy / dt) * 0.25;

        b.x = nx;
        b.y = ny;
        drag.lastT = now;
        render(b);
    }

    function onPointerUp(e) {
        if (!drag || e.pointerId !== drag.id) return;

        const { el, b } = drag;
        const heldFor = performance.now() - drag.downT;

        el.classList.remove('dragging');
        el.removeEventListener('pointermove', onPointerMove);
        el.removeEventListener('pointerup', onPointerUp);
        el.removeEventListener('pointercancel', onPointerUp);

        b.dragging = false;

        if (drag.moved < 10 && heldFor < 400) {
            const cx = b.x + b.w / 2;
            const cy = b.y + b.h / 2;

            let dx = cx - e.clientX;
            let dy = cy - e.clientY;
            let d  = Math.hypot(dx, dy);

            if (d < 1) { dx = 0; dy = -1; d = 1; }

            const nx = dx / d;
            const ny = dy / d;
            const power = POKE_MIN + (POKE_MAX - POKE_MIN) * Math.min(d / (b.w * 0.5), 1);

            b.vx += nx * power;
            b.vy += ny * power;

            b.sqv += 6;
        } else {
            b.vx = clamp(drag.vx, -MAX_V, MAX_V) * 0.9;
            b.vy = clamp(drag.vy, -MAX_V, MAX_V) * 0.9;
        }

        drag = null;
    }
    let lastT = performance.now();

    function tick(now) {
        const dt = Math.min((now - lastT) / 1000, 0.05);
        lastT = now;
        const t = now / 1000;

        const W = window.innerWidth;
        const H = window.innerHeight;

        balloons.forEach(b => {
            b.sqv += (-b.sq * 420 - b.sqv * 15) * dt;
            b.sq   = clamp(b.sq + b.sqv * dt, -0.35, 0.35);

            if (!b.dragging) {
                b.vy -= LIFT * dt;

                b.vx += Math.sin(t * 1.1 + b.phase) * 26 * dt;
                b.vy += Math.cos(t * 0.7 + b.phase) * 14 * dt;

                const damp = Math.pow(AIR_DAMP, dt);
                b.vx *= damp;
                b.vy *= damp;

                b.vx = clamp(b.vx, -MAX_V, MAX_V);
                b.vy = clamp(b.vy, -MAX_V, MAX_V);

                b.x += b.vx * dt;
                b.y += b.vy * dt;=
                
                if (b.x < 0) {
                    b.x = 0;
                    b.vx = Math.abs(b.vx) * WALL_BOUNCE;
                } else if (b.x + b.w > W) {
                    b.x = W - b.w;
                    b.vx = -Math.abs(b.vx) * WALL_BOUNCE;
                }

                if (b.y + b.h > H) {
                    b.y = H - b.h;
                    b.vy = -Math.abs(b.vy) * 0.5;
                }

                if (b.y + b.h < 0) {                       // drifted off the top
                    b.x = rand(0, Math.max(0, W - b.w));
                    b.y = H + 10;
                    b.vx = rand(-20, 20);
                    b.vy = -rand(30, 70);
                }
            }

            render(b);
        });

        requestAnimationFrame(tick);
    }
    setInterval(createBubble,  CFG.bubble.rate);
    setInterval(createBalloon, CFG.balloon.rate);

    for (let i = 0; i < 3; i++) setTimeout(createBubble,  i * 600);
    for (let i = 0; i < 2; i++) setTimeout(createBalloon, i * 900);

    requestAnimationFrame(tick);
});
</script>
</body>
</html>
